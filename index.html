<script>
(function(){
  const certificateData = [{"title": "Certified Management Accountant (CMA Part I)", "issuer": "Egyptian Science House", "date": "July 2025", "detail": "Professional management accounting training completed with an Excellent grade.", "image": "WhatsApp Image 2026-09-01 at 8.21.13 PM.jpeg"}, {"title": "Certified Management Accountant — CMA Part I", "issuer": "Board of Professional Studies", "date": "July 2025", "detail": "Diploma training certificate documenting participation in the CMA Part I programme.", "image": "WhatsApp Image 2026-09-01 at 8.21.13 PM (1).jpeg"}, {"title": "Accounting Experience Certificate", "issuer": "Assets Accountant Office", "date": "2025", "detail": "Professional certificate documenting practical accounting experience and responsibilities.", "image": "WhatsApp Image 2026-09-01 at 8.21.13 PM (2).jpeg"}, {"title": "Odoo Accounting Diploma", "issuer": "Board of Professional Studies", "date": "July 2025", "detail": "Diploma training focused on accounting workflows and professional Odoo practice.", "image": "WhatsApp Image 2026-09-01 at 8.21.14 PM.jpeg"}, {"title": "Odoo Accounting Training Certificate", "issuer": "Egyptian Science House", "date": "May–July 2025", "detail": "Completed 15 hours of Odoo Accounting training with an Excellent result.", "image": "WhatsApp Image 2026-09-01 at 8.21.14 PM (1).jpeg"}, {"title": "Accounting Training Certificate", "issuer": "Professional accounting training", "date": "2025", "detail": "Supporting certificate included as part of the professional accounting portfolio.", "image": "WhatsApp Image 2026-09-01 at 8.21.14 PM (2).jpeg"}];
  const mount = function(){
    const education = document.getElementById('education');
    const container = education && education.querySelector('.container-x');
    if(!container) return false;
    if(container.querySelector('.education-certificates-block')) return true;
    const block = document.createElement('div');
    block.className = 'education-certificates-block';
    const rows = certificateData.map(function(item,index){
      const imagePath = encodeURI(item.image);
      const reversed = index % 2 === 1 ? ' is-reversed' : '';
      return '<div class="education-certificate-row'+reversed+'">'
        + '<button class="education-certificate-image-button" type="button" aria-label="Open '+item.title+' certificate">'
        + '<img class="education-certificate-image" src="'+imagePath+'" alt="'+item.title+'" loading="lazy">'
        + '</button>'
        + '<article class="education-certificate-info">'
        + '<span class="education-certificate-index">CERTIFICATE 0'+(index+1)+'</span>'
        + '<h4>'+item.title+'</h4>'
        + '<p class="education-certificate-issuer">'+item.issuer+'</p>'
        + '<p class="education-certificate-detail">'+item.detail+'</p>'
        + '<div class="education-certificate-meta"><span>'+item.date+'</span><span>Supporting document</span></div>'
        + '</article></div>';
    }).join('');
    block.innerHTML = '<div class="education-certificates-heading"><div><p class="education-certificates-eyebrow">DOCUMENTED LEARNING</p><h3>Certificates &amp; supporting documents</h3></div><p class="education-certificates-intro">A clear view of the certificates supporting my academic background and professional accounting development.</p></div><div class="education-certificate-list">'+rows+'</div><div class="education-certificate-lightbox" role="dialog" aria-modal="true" aria-label="Certificate preview" hidden><button class="education-certificate-lightbox-close" type="button" aria-label="Close preview">&times;</button><img class="education-certificate-lightbox-image" alt="Certificate preview"></div>';
    container.appendChild(block);
    const lightbox = block.querySelector('.education-certificate-lightbox');
    const preview = block.querySelector('.education-certificate-lightbox-image');
    const close = block.querySelector('.education-certificate-lightbox-close');
    const buttons = block.querySelectorAll('.education-certificate-image-button');
    const shut = function(){lightbox.hidden=true;preview.removeAttribute('src');document.body.style.overflow='';};
    buttons.forEach(function(button){button.addEventListener('click',function(){const image=button.querySelector('img');preview.src=image.src;preview.alt=image.alt;lightbox.hidden=false;document.body.style.overflow='hidden';close.focus();});});
    close.addEventListener('click',shut);
    lightbox.addEventListener('click',function(event){if(event.target===lightbox)shut();});
    document.addEventListener('keydown',function(event){if(event.key==='Escape'&&!lightbox.hidden)shut();});
    return true;
  };
  let attempts = 0;
  const timer = setInterval(function(){if(mount() || attempts++ > 200)clearInterval(timer);},50);
})();
</script>
</body>
</html>
